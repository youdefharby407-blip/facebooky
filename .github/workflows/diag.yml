name: Firebase diagnostics
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/firebase_diag.py > diag.txt 2>&1 || true
          gh release delete diag --yes --cleanup-tag || true
          gh release create diag diag.txt --prerelease --title "Firebase diagnostics" --notes "diag"
