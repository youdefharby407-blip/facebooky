name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FaceBooky-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FaceBooky.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FaceBooky.apk --title "FaceBooky (latest build)" --notes "Build ${{ github.run_number }}"
